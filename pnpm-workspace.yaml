packages:
  - "frontend"
  - "backend"
  - "common"
  - "games/*"

# Next 15 pins an older PostCSS; retain its 8.x API with the reviewed security fixes.
overrides:
  "next@15.5.24>postcss": "8.5.26"
  # LHCI has no newer release; preserve its used fileSync/dirSync and v4 APIs.
  "@lhci/cli@0.15.1>tmp": "0.2.7"
  "external-editor@3.1.0>tmp": "0.2.7"
  "@lhci/cli@0.15.1>uuid": "11.1.1"
  # Puppeteer 24 still downloads through vulnerable extract-zip. Keep Lighthouse
  # 12.6.1's measurement model while using the maintained browser downloader.
  "lighthouse@12.6.1>puppeteer-core": "25.12.0"
  # Refresh the auto-installed optional Storybook peer within Webpack 5.
  "webpack@<5.104.1": "5.111.1"

# The downloader makes proxy/ZIP support optional. Supply its supported peers
# locally instead of inheriting LHCI's older proxy implementation by accident.
packageExtensions:
  "puppeteer-core@25.12.0":
    dependencies:
      proxy-agent: "8.0.1"
      yauzl: "3.4.0"
