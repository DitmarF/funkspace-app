<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave Survivor — Standalone Demo</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      main {
        display: grid;
        width: 100%;
        gap: 1rem;
        justify-items: center;
      }

      h1,
      p {
        margin: 0;
      }

      .game-status-panel {
        display: flex;
        width: min(calc(100% - 2rem), 33.75rem);
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .game-feedback {
        position: relative;
        width: min(calc(100% - 2rem), 33.75rem);
        height: 5.5rem;
        text-align: center;
      }

      button {
        min-width: 8rem;
        min-height: 2.75rem;
        padding: 0.625rem 1rem;
        border: 2px solid CanvasText;
        border-radius: 0.375rem;
        background: Canvas;
        color: CanvasText;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid Highlight;
        outline-offset: 3px;
      }

      #game-restart {
        position: absolute;
        inset-block-end: 0;
        inset-inline-start: 50%;
        transform: translateX(-50%);
      }

      [hidden] {
        display: none !important;
      }

      .game-frame {
        position: relative;
        overflow: hidden;
        width: min(calc(100% - 2rem), calc(56.25vh - 7.875rem), 33.75rem);
        width: min(calc(100% - 2rem), calc(56.25dvh - 7.875rem), 33.75rem);
        aspect-ratio: 9 / 16;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: Canvas;
        color: CanvasText;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Wave Survivor</h1>
      <div id="game-viewport" class="game-frame">
        <canvas
          id="game-canvas"
          width="360"
          height="640"
          aria-label="Wave Survivor game canvas"
        >
          Your browser does not support the canvas element.
        </canvas>
      </div>
      <section class="game-status-panel" aria-label="Game status">
        <p id="game-health">Health: —</p>
        <p id="game-kills">Kills: —</p>
      </section>
      <div class="game-feedback">
        <p id="game-announcement" role="status" aria-live="polite">
          Starting arena…
        </p>
        <button id="game-restart" type="button" hidden>Restart game</button>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
