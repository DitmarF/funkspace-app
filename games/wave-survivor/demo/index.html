<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave Survivor — Standalone Demo</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      main {
        display: grid;
        width: 100%;
        gap: 1rem;
        justify-items: center;
      }

      h1,
      p {
        margin: 0;
      }

      .game-status-panel {
        display: flex;
        width: min(calc(100% - 2rem), 33.75rem);
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 1rem;
      }

      .game-feedback {
        display: grid;
        width: min(calc(100% - 2rem), 33.75rem);
        min-height: 5.5rem;
        gap: 0.75rem;
        justify-items: center;
        text-align: center;
      }

      button {
        min-width: 8rem;
        min-height: 2.75rem;
        padding: 0.625rem 1rem;
        border: 2px solid CanvasText;
        border-radius: 0.375rem;
        background: Canvas;
        color: CanvasText;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid Highlight;
        outline-offset: 3px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      [hidden] {
        display: none !important;
      }

      .game-stage {
        position: relative;
        display: grid;
        width: 100%;
        justify-items: center;
      }

      .game-frame {
        position: relative;
        overflow: hidden;
        width: min(calc(100% - 2rem), calc(56.25vh - 7.875rem), 33.75rem);
        width: min(calc(100% - 2rem), calc(56.25dvh - 7.875rem), 33.75rem);
        aspect-ratio: 9 / 16;
      }

      .upgrade-panel {
        position: absolute;
        z-index: 1;
        inset-block: 0;
        left: 50%;
        transform: translateX(-50%);
        box-sizing: border-box;
        width: min(calc(100% - 2rem), 33.75rem);
        display: grid;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        padding: clamp(1rem, 5vw, 2rem);
        align-content: start;
        background: Canvas;
        color: CanvasText;
      }

      @media (max-height: 40rem) {
        .upgrade-panel {
          position: fixed;
          inset-block: 1rem;
        }
      }

      .upgrade-panel h2 {
        margin: 0 0 1rem;
        text-align: center;
      }

      .upgrade-options {
        display: grid;
        gap: 0.75rem;
      }

      .upgrade-option {
        box-sizing: border-box;
        display: grid;
        width: 100%;
        min-width: 0;
        min-height: 4.5rem;
        gap: 0.25rem;
        justify-items: start;
        text-align: start;
        overflow-wrap: anywhere;
      }

      .upgrade-option-title {
        font-size: 1rem;
      }

      .upgrade-option-description {
        font-size: 0.875rem;
        font-weight: 400;
        line-height: 1.35;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: Canvas;
        color: CanvasText;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Wave Survivor</h1>
      <div class="game-stage">
        <div id="game-viewport" class="game-frame">
          <canvas
            id="game-canvas"
            width="360"
            height="640"
            aria-label="Wave Survivor game canvas"
          >
            Your browser does not support the canvas element.
          </canvas>
        </div>
        <section
          id="game-upgrades"
          class="upgrade-panel"
          aria-labelledby="game-upgrades-heading"
          hidden
        >
          <h2 id="game-upgrades-heading">Choose an upgrade</h2>
          <div id="game-upgrade-options" class="upgrade-options"></div>
        </section>
      </div>
      <section class="game-status-panel" aria-label="Game status">
        <p id="game-wave">Wave: —</p>
        <p id="game-health">Health: —</p>
        <p id="game-kills">Kills: —</p>
      </section>
      <div class="game-feedback">
        <p id="game-announcement" role="status" aria-live="polite">
          Starting arena…
        </p>
        <button id="game-restart" type="button" hidden>Restart game</button>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
