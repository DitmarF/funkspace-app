name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, Types, Unit, E2E, LHCI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm build:tokens

      - name: Lint & Prettier
        run: pnpm lint

      - name: Typecheck (frontend)
        run: |
          cd frontend
          pnpm exec tsc --noEmit

      - name: Unit tests (Vitest)
        run: pnpm coverage

      - name: Install Playwright browsers
        run: pnpm setup:browsers

      - name: E2E tests (Playwright)
        run: pnpm e2e

      - name: Build frontend
        run: pnpm build

      - name: Lighthouse CI (flag OFF)
        run: pnpm lhci:off

      - name: Lighthouse CI (flag ON)
        run: pnpm lhci:on
