version: 2
updates:
  # One pnpm workspace job updates every package with the shared root lockfile.
  # Separate package-directory jobs produced manifest-only PRs that failed CI.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    labels: ["npm-deps"]
    rebase-strategy: "auto"
    open-pull-requests-limit: 4
    groups:
      storybook:
        applies-to: version-updates
        patterns: ["storybook", "@storybook/*"]
        update-types: ["minor", "patch"]
      next-react:
        applies-to: version-updates
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
      development:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "patch"]
      production:
        applies-to: version-updates
        dependency-type: production
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions version bumps for all workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    labels: ["actions-deps"]
    rebase-strategy: "auto"
    open-pull-requests-limit: 2
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
