<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave Survivor — Standalone Demo</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      main {
        display: grid;
        width: 100%;
        gap: 1rem;
        justify-items: center;
      }

      h1,
      p {
        margin: 0;
      }

      .game-frame {
        width: min(calc(100% - 2rem), 44vh, 33.75rem);
        width: min(calc(100% - 2rem), 44dvh, 33.75rem);
        aspect-ratio: 9 / 16;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: Canvas;
        color: CanvasText;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Wave Survivor</h1>
      <div class="game-frame">
        <canvas
          id="game-canvas"
          width="360"
          height="640"
          aria-label="Wave Survivor game canvas"
        >
          Your browser does not support the canvas element.
        </canvas>
      </div>
      <p id="game-status" role="status" aria-live="polite">Starting arena…</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
